<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | NoteSphere</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="NoteSphere Logo" width="32" height="32" />
        <span>NoteSphere</span>
      </a>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/browse.html">Browse Notes</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Auth Page Content -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <img src="/assets/logo.svg" alt="NoteSphere Logo" width="48" height="48" />
        </div>
        <h1>Create Your Account</h1>
        <p>Join the NoteSphere academic sharing community</p>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="auth-alert"></div>

      <!-- Register Form -->
      <form id="register-form">
        <div class="form-group">
          <label for="register-name" class="form-label">Full Name *</label>
          <input 
            type="text" 
            id="register-name" 
            class="form-control" 
            placeholder="Alex Smith" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email Address *</label>
          <input 
            type="email" 
            id="register-email" 
            class="form-control" 
            placeholder="student@example.edu" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Password *</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="register-password" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              required 
              minlength="6" 
            />
            <button type="button" id="toggle-password-btn" class="password-toggle-btn" title="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="register-confirm-password" class="form-label">Confirm Password *</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="register-confirm-password" 
              class="form-control" 
              placeholder="Re-enter password" 
              required 
            />
            <button type="button" id="toggle-confirm-password-btn" class="password-toggle-btn" title="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div><strong>NoteSphere</strong> — Cloud-Based Notes Sharing Platform</div>
      <div><span>All Rights Reserved NoteSphere @ 2026 | Harsh Bhayekar</span></div>
    </div>
  </footer>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("register-form");
      const alertBox = document.getElementById("auth-alert");
      const passInput = document.getElementById("register-password");
      const confirmPassInput = document.getElementById("register-confirm-password");
      const togglePass = document.getElementById("toggle-password-btn");
      const toggleConfirmPass = document.getElementById("toggle-confirm-password-btn");

      // Toggle password visibilities
      if (togglePass) {
        togglePass.addEventListener("click", () => {
          passInput.type = passInput.type === "password" ? "text" : "password";
        });
      }
      if (toggleConfirmPass) {
        toggleConfirmPass.addEventListener("click", () => {
          confirmPassInput.type = confirmPassInput.type === "password" ? "text" : "password";
        });
      }

      function showAlert(htmlMessage, type = "error") {
        alertBox.className = `auth-alert ${type}`;
        alertBox.innerHTML = htmlMessage;
        alertBox.style.display = "block";
      }

      function hideAlert() {
        alertBox.className = "auth-alert";
        alertBox.style.display = "none";
        alertBox.innerHTML = "";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();

        const name = document.getElementById("register-name").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const password = passInput.value;
        const confirmPass = confirmPassInput.value;
        const btn = document.getElementById("register-submit-btn");

        // Validation rules
        if (!name) {
          showAlert("Please enter your full name.");
          return;
        }

        if (!email || !email.includes("@") || !email.includes(".")) {
          showAlert("Please enter a valid email address (e.g. student@example.edu).");
          return;
        }

        if (password.length < 6) {
          showAlert("Password must be at least 6 characters long.");
          passInput.focus();
          return;
        }

        if (password !== confirmPass) {
          showAlert("Passwords do not match. Please ensure both passwords match.");
          confirmPassInput.focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = "Creating Account...";

        try {
          const user = await handleRegister(name, email, password);
          showAlert(`Account created successfully! Welcome, ${escapeHtml(user.displayName || "Student")}! Redirecting...`, "success");
          showToast(`Welcome to NoteSphere, ${user.displayName || "Student"}!`, "success");
          setTimeout(() => {
            window.location.href = "/browse.html";
          }, 900);
        } catch (err) {
          console.error("Registration error:", err);
          const friendlyMessage = typeof formatAuthErrorMessage === "function" 
            ? formatAuthErrorMessage(err) 
            : (err.message || "Unable to create account. Please check your information and try again.");
          showAlert(friendlyMessage, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      });
    });
  </script>
</body>
</html>
